# ARCADE game portal — serves the dashboard and reverse-proxies the games.
# Routes (trailing slash on proxy_pass strips the /g/<name>/ prefix):
#   /                -> this dashboard (static)
#   /g/snake/        -> game service                (snake)
#   /g/unbreakable/  -> human-unbreakable service   (action)
#   /g/runner/       -> indian-road-runner service  (runner)
#   /g/mars/         -> mars-last-rover service      (survival)
#   /api/            -> leaderboard service          (shared scores)
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /g/snake/ {
        proxy_pass http://game.default.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /g/unbreakable/ {
        proxy_pass http://human-unbreakable.default.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /g/runner/ {
        proxy_pass http://indian-road-runner.default.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://leaderboard.default.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /g/mars/ {
        proxy_pass http://mars-last-rover.default.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
